# Fail2ban — jail do AMPS (Projeto Final de Segurança).
# Bane o IP que falhar o login/estourar o rate limit repetidamente.
# Ajuste `logpath` para o caminho real do repositório nesta máquina.
[amps-auth]
enabled  = true
filter   = amps-auth
# Caminho do log de segurança gerado pela API (SECURITY_LOG=../../logs/seguranca.log):
logpath  = /home/felipegegembauer/dev/faculdade/AMPS/logs/seguranca.log
backend  = polling
maxretry = 5
findtime = 60
bantime  = 600
# Fedora usa nftables/firewalld. Alternativas: iptables-multiport, firewallcmd-rich-rules.
banaction = nftables-allports
