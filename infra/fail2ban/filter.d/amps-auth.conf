# Fail2ban — filtro do AMPS (Projeto Final de Segurança).
# Casa as linhas do log de segurança da API escritas em endurecimento.ts:
#   2026-11-26T17:30:08.275Z AUTH_FAIL  ip=127.0.0.1 email=alvo@x
#   2026-11-26T17:30:08.337Z RATE_LIMIT ip=127.0.0.1
# <HOST> captura o IP (IPv4/IPv6) que será banido.
[Definition]
failregex = ^\S+ (?:AUTH_FAIL|RATE_LIMIT) ip=<HOST>
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
