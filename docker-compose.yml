services:
  mysql:
    image: mysql:8.0
    container_name: amps-mysql
    restart: unless-stopped
    # Exige TLS em conexões TCP (RA2 — dados em trânsito até o banco). O MySQL 8 já
    # serve TLS com certificado próprio gerado na inicialização.
    command: ["--require-secure-transport=ON"]
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

  # Borda TLS (Projeto Final de Segurança): termina HTTPS com a CA própria e
  # repassa para a API (:3001) e o Merlian (:3000), que seguem em HTTP no loopback.
  # network_mode: host para alcançar os serviços locais em 127.0.0.1.
  caddy:
    image: caddy:2.8
    container_name: amps-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/tls/out:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
