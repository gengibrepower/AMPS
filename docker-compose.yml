services:
  neo4j:
    image: neo4j:5
    container_name: amps-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # web UI (http://localhost:7474)
      - "7687:7687"   # bolt (os adaptadores conectam aqui)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  mysql:
    image: mysql:8.0
    container_name: amps-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  neo4j_data:
  neo4j_logs:
  mysql_data: