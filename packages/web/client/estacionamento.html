<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="../css/detalhes.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,arrow_back,close,directions_car,grid_view,logout,map,menu,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="marca" href="/index.html">
            <img src="/assets/images/logo_holder.png" alt="">
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="pagina-detalhes">
        <p id="mensagem"></p>

        <article id="detalhes" class="detalhes disabled">
            <section class="capa">
                <div id="capaPlanta" class="capa-imagem"><img src="../assets/images/capa-padrao.svg" alt=""></div>
                <div class="capa-texto">
                    <a href="search.html" class="voltar">
                        <span class="material-symbols-outlined">arrow_back</span>
                        Voltar à busca
                    </a>
                    <h2 id="nome" class="capa-nome"></h2>
                    <p id="local" class="capa-local"></p>
                </div>
            </section>

            <div class="conteudo">
                <aside class="lateral">
                    <a id="verMapa" href="" class="botao-principal">
                        <span class="material-symbols-outlined">map</span>
                        Ver mapa
                    </a>

                    <section class="bloco">
                        <h3>Endereço</h3>
                        <ul id="endereco" class="endereco"></ul>
                    </section>
                </aside>

                <div class="principal">
                    <section class="bloco">
                        <h3>Vagas</h3>
                        <p id="disponiveis" class="disponiveis">
                            <span id="totalDeVagasLivres" class="disponiveis-numero"></span>
                            <span id="rotuloDoTotalLivres" class="disponiveis-rotulo"></span>
                        </p>
                        <p class="total">
                            <span id="totalDeVagas"></span> <span id="rotuloDoTotal"></span><span id="ocupacao" class="ocupacao"></span>
                        </p>
                        <ul id="vagasPorTipo" class="etiquetas"></ul>
                    </section>

                    <section id="secaoPois" class="bloco disabled">
                        <h3>Pontos de interesse</h3>
                        <p class="bloco-dica">Lugares do pátio marcados pelo estacionamento.</p>
                        <ul id="pontos" class="etiquetas"></ul>
                    </section>
                </div>
            </div>
        </article>
    </main>

    <script type="module" src="../src/dom/navegacao.ts"></script>
    <script type="module" src="../src/pages/detalhes.ts"></script>
</body>
</html>
