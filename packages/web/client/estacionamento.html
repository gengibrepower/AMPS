<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="../css/detalhes.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,arrow_back,chevron_right,close,directions_car,grid_view,location_on,logout,map,menu,near_me,open_in_new,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="marca" href="/index.html">
            <img src="/assets/images/logo_holder.png" alt="">
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="pagina-detalhes">
        <p id="mensagem"></p>

        <article id="detalhes" class="detalhes disabled">
            <section class="capa">
                <div id="capaPlanta" class="capa-imagem"><img src="../assets/images/capa-padrao.svg" alt=""></div>
                <div class="capa-texto">
                    <a href="search.html" class="voltar">
                        <span class="material-symbols-outlined">arrow_back</span>
                        Voltar à busca
                    </a>
                    <h2 id="nome" class="capa-nome"></h2>
                    <p id="local" class="capa-local"></p>
                </div>
            </section>

            <div class="conteudo">
                <aside class="lateral">
                    <a id="verMapa" href="" class="botao-principal">
                        <span class="material-symbols-outlined" aria-hidden="true">map</span>
                        Ver mapa
                    </a>

                    <section class="bloco-endereco" aria-labelledby="tituloEndereco">
                        <h3 id="tituloEndereco" class="titulo-com-icone">
                            <span class="material-symbols-outlined" aria-hidden="true">location_on</span>
                            Endereço
                        </h3>
                        <ul id="endereco" class="endereco"></ul>
                        <a id="abrirNoMaps" href="" class="link-externo disabled" target="_blank" rel="noopener">
                            Abrir no Google Maps
                            <span class="material-symbols-outlined" aria-hidden="true">open_in_new</span>
                        </a>
                    </section>
                </aside>

                <div class="principal">
                    <section class="cartao" aria-labelledby="tituloAgora">
                        <h3 id="tituloAgora" class="cartao-titulo">Vagas agora</h3>
                        <p id="disponiveis" class="disponiveis">
                            <span id="totalDeVagasLivres" class="disponiveis-numero"></span>
                            <span id="rotuloDoTotalLivres" class="disponiveis-rotulo"></span>
                        </p>
                        <div id="barraDeOcupacao" class="barra" role="img">
                            <span id="barraLivre" class="barra-livre"></span>
                            <span id="barraOcupada" class="barra-ocupada"></span>
                        </div>
                        <ul class="barra-legenda">
                            <li><i class="ponto ponto-livre"></i><span id="legendaLivres"></span></li>
                            <li><i class="ponto ponto-ocupada"></i><span id="legendaOcupadas"></span></li>
                        </ul>
                    </section>

                    <section class="cartao" aria-labelledby="tituloTipos">
                        <h3 id="tituloTipos" class="cartao-titulo">Tipos de vaga</h3>
                        <ul id="vagasPorTipo" class="tipos"></ul>
                    </section>

                    <section id="secaoPois" class="cartao disabled" aria-labelledby="tituloDestinos">
                        <h3 id="tituloDestinos" class="cartao-titulo">Para onde você vai?</h3>
                        <p class="cartao-dica">Escolha um destino e o mapa já abre procurando a vaga mais perto dele.</p>
                        <ul id="pontos" class="destinos"></ul>
                    </section>
                </div>
            </div>
        </article>
    </main>

    <script type="module" src="../src/pages/detalhes.ts"></script>
</body>
</html>
