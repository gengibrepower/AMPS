<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamentos - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,close,directions_car,grid_view,logout,menu,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="marca" href="/index.html">
            <img src="/assets/images/logo_holder.png" alt="">
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <form action="search.html" method="GET" class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="search" name="q" placeholder="Pesquisar estacionamento..." autocomplete="off">
        </form>

        <h2 id="resultadoTitulo">Resultados para: </h2>

        <ul class="result-list" id="resultados"></ul>
        <p id="mensagem"></p>
    </main>

    <script type="module" src="../src/pages/busca.ts"></script>
</body>
</html>
