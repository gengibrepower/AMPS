<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/owner.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,close,directions_car,grid_view,logout,menu,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="marca" href="/index.html">
            <img src="/assets/images/logo_holder.png" alt="">
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <section id="bloqueio" class="bloqueio disabled">
            <h2>Meu perfil</h2>
            <p id="bloqueioTexto"></p>
            <a href="../index.html" class="botao-primario">Ir para o login</a>
        </section>

        <section id="area" class="disabled">
            <div class="titulo-linha">
                <h2>Meu perfil</h2>
            </div>

            <form id="formDados" class="formulario" novalidate>
                <h3>Dados da conta</h3>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" maxlength="255" required autocomplete="name">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" maxlength="255" required autocomplete="email">
                </div>

                <div class="formulario-acoes">
                    <button type="submit" id="salvarDados" class="botao-primario">Salvar</button>
                </div>

                <p id="mensagemDados" class="message"></p>
            </form>

            <form id="formSenha" class="formulario" novalidate>
                <h3>Alterar senha</h3>

                <div class="campo">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" name="senhaAtual" required autocomplete="current-password">
                </div>

                <div class="campo">
                    <label for="senhaNova">Nova senha</label>
                    <input type="password" id="senhaNova" name="senhaNova" required autocomplete="new-password">
                </div>

                <div class="campo">
                    <label for="senhaConfirmacao">Confirmar nova senha</label>
                    <input type="password" id="senhaConfirmacao" name="senhaConfirmacao" required autocomplete="new-password">
                </div>

                <div class="formulario-acoes">
                    <button type="submit" id="salvarSenha" class="botao-primario">Alterar senha</button>
                </div>

                <p id="mensagemSenha" class="message"></p>
            </form>
        </section>
    </main>

    <script type="module" src="../src/pages/perfil.ts"></script>
</body>
</html>
