<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus carros - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/owner.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,add,close,directions_car,grid_view,logout,menu,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="marca" href="/index.html">
            <img src="/assets/images/logo_holder.png" alt="">
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <section id="bloqueio" class="bloqueio disabled">
            <h2>Meus carros</h2>
            <p id="bloqueioTexto"></p>
            <a href="../index.html#entrar" class="botao-primario">Ir para o login</a>
        </section>

        <section id="area" class="disabled">
            <div class="titulo-linha">
                <h2>Meus carros</h2>
                <button type="button" id="abrirNovo" class="botao-primario">
                    <span class="material-symbols-outlined">add</span>
                    Novo
                </button>
            </div>

            <form id="formNovo" class="formulario disabled" novalidate>
                <div class="campo">
                    <label for="placa">Placa</label>
                    <input
                        type="text"
                        id="placa"
                        name="placa"
                        maxlength="20"
                        required
                        autocomplete="off"
                    >
                </div>

                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <select id="modelo" name="modelo" required>
                        <option value="">Selecione um modelo</option>
                    </select>
                </div>

                <div class="formulario-acoes">
                    <button type="button" id="cancelarNovo" class="botao-texto">Cancelar</button>
                    <button type="submit" id="salvarNovo" class="botao-primario">Cadastrar</button>
                </div>
            </form>

            <p id="mensagem" class="message"></p>

            <p id="vazio" class="vazio disabled">
                Nenhum carro cadastrado ainda.
            </p>

            <ul id="lista" class="lista"></ul>
        </section>
    </main>

    <script type="module" src="../src/pages/carro.ts"></script>
</body>
</html>
