<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/images/emblema.svg">
    <title>Mapa do estacionamento - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/mapa.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=arrow_back"/>
</head>
<body>
    <header>
        <a id="voltar" href="search.html" class="voltar" aria-label="Voltar">
            <span class="material-symbols-sharp">arrow_back</span>
        </a>
        <span id="nomeDoPatio" class="nome">Carregando…</span>
    </header>

    <p id="mensagem"></p>
    <div class="area-do-mapa">
        <div id="palco" class="palco"></div>

        <aside class="painel" aria-labelledby="painelTitulo">
            <h2 id="painelTitulo" class="painel-titulo">Encontrar vaga</h2>

            <p id="semConta" class="painel-aviso disabled">
                Entre com sua conta para receber uma vaga.
                <a href="/index.html#entrar">Entrar</a>
            </p>
            <p id="semCarro" class="painel-aviso disabled">
                Cadastre um carro para o AMPS saber em que vaga ele cabe.
                <a href="/client/carro.html">Cadastrar carro</a>
            </p>

            <form id="formVaga" class="painel-form">
                <label for="carro">Carro</label>
                <select id="carro" required></select>

                <label for="destino">Para onde você vai</label>
                <select id="destino" required></select>

                <label for="entrada">Por onde você entra</label>
                <select id="entrada" required></select>

                <button type="submit" id="encontrar" class="botao-encontrar">Encontrar vaga</button>
            </form>

            <div id="resultado" class="resultado disabled" aria-live="polite">
                <svg class="resultado-leque" viewBox="0 0 80 30" aria-hidden="true"><path d="M40 30L40 2M40 30L52 4M40 30L28 4M40 30L62 10M40 30L18 10M40 30L70 19M40 30L10 19" stroke="#B08A3E" stroke-width="1.5"/></svg>
                <span class="resultado-rotulo">Sua vaga</span>
                <strong id="resultadoNumero" class="resultado-numero"></strong>
                <span id="resultadoDetalhe" class="resultado-detalhe"></span>
                <dl class="resultado-trajeto">
                    <div><dt>Carro</dt><dd id="resultadoCarro"></dd></div>
                    <div><dt>Destino</dt><dd id="resultadoDestino"></dd></div>
                    <div><dt>Entrada</dt><dd id="resultadoEntrada"></dd></div>
                </dl>
                <button type="button" id="limpar" class="botao-limpar">Escolher de novo</button>
            </div>

            <p id="avisoVaga" class="message" aria-live="polite"></p>

            <ul class="legenda" aria-label="Legenda">
                <li><i class="amostra amostra-livre"></i>Livre</li>
                <li><i class="amostra amostra-ocupada"></i>Ocupada</li>
                <li><i class="amostra amostra-pcd"></i>PCD</li>
                <li><i class="amostra amostra-idoso"></i>Idoso</li>
                <li><i class="amostra amostra-moto"></i>Moto</li>
                <li><i class="amostra amostra-eletrico"></i>Elétrico</li>
                <li><i class="amostra amostra-sua"></i>Sua vaga</li>
            </ul>
        </aside>
    </div>
    <script type="module" src="../src/client-map/mapa.ts"></script>
</body>
</html>
