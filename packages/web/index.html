<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,chevron_right,directions_car,grid_view,home,menu,person,search"/>
</head>
<body>
    <header>
        <button id="menu-button" aria-label="Abrir menu"><span class="material-symbols-outlined">menu</span></button>
        <div class="logo">
            <img id="logo-holder" src="assets/images/logo_holder.png" alt="AMPS">
            <h1 id="logo-text">AMPS</h1>
        </div>
    </header>

    <nav class="sidebar-nav disabled">
        <div class="sidebar">
            <button id="close-sidebar-button" aria-label="Fechar menu">X</button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-outlined">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>
 
    <main>
        <form action="client/search.html" method="GET" class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="search" name="q" placeholder="Pesquisar estacionamento..." autocomplete="off">
        </form>

        <section id="historico" class="historico disabled">
            <h2 class="historico-titulo">Abertos recentemente</h2>
            <ul id="listaDoHistorico" class="historico-lista"></ul>
        </section>
    </main>
 
    <div class="login disabled" id="accountPanel">
        <div class="login-box">
            <button id="closeLogin" aria-label="Fechar conta">X</button>

            <!-- Login -->
            <div id="accountLoggedOut" class="account-view">
                <div class="accountLogin">
                    <h2>Acessar Conta</h2>
                        <form id="login-form">
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" required />
                            </div>
                            <div class="form-group">
                                <label for="senha">Senha</label>
                                <input type="password" id="senha" required />
                            </div>
                            <button type="submit" class="btn-primary">Entrar</button>
                        </form>
                    <div id="login-msg" class="message"></div>
                        <div class="links">
                            <a href="#" id="linkRegisterClient">Criar conta</a>
                            <a href="#" id="linkRegisterOwner">Sou Dono de um estacionamento</a>
                        </div>
                </div>
            </div>

            <!-- Logado -->
            <div id="accountLoggedIn" class="account-view disabled">
                <p>Logado como <strong id="accountEmail"></strong></p>
                <button type="button" id="logoutBtn">Sair</button>
            </div>

            <!-- Criar conta -->
            <div id="accountRegisterClient" class="account-view disabled">
                <div class="accountLogin">
                    <h2>Criar Conta</h2>
                    <form id="client-form">
                        <div class="form-group">
                            <label for="nome-cli">Nome Completo</label>
                            <input type="text" id="nome-cli" required />
                        </div>
                        <div class="form-group">
                            <label for="email-cli">E-mail</label>
                            <input type="email" id="email-cli" placeholder="seu.email@gmail.com" required />
                        </div>
                        <div class="form-group">
                            <label for="cpf-cli">CPF</label>
                            <input type="text" id="cpf-cli" placeholder="000.000.000-00" required />
                        </div>
                        <div class="form-group">
                            <label for="senha-cli">Senha</label>
                            <input type="password" id="senha-cli" required />
                        </div>
                        <button type="submit" class="btn-primary">Cadastrar Cliente</button>
                    </form>
                    <div id="client-msg" class="message"></div>
                    <div class="links">
                        <a href="#" id="linkBackToLoginFromRegister">Já tem uma conta? Faça login</a>
                    </div>
                </div>
            </div>

            <!-- Criar conta de dono -->
            <div id="accountRegisterOwner" class="account-view disabled">
                <div class="accountLogin">
                    <h2>Cadastrar Estacionamento</h2>
                    <form id="owner-form">
                        <div class="form-group">
                            <label for="nome-dono">Nome do Responsável</label>
                            <input type="text" id="nome-dono" required />
                        </div>
                        <div class="form-group">
                            <label for="email-dono">E-mail</label>
                            <input type="email" id="email-dono" placeholder="seu.email@gmail.com" required />
                        </div>
                        <div class="form-group">
                            <label for="cpf-dono">CPF</label>
                            <input type="text" id="cpf-dono" placeholder="000.000.000-00" required />
                        </div>
                        <div class="form-group">
                            <label for="razao-dono">Razão Social</label>
                            <input type="text" id="razao-dono" required />
                        </div>
                        <div class="form-group">
                            <label for="cnpj-dono">CNPJ</label>
                            <input type="text" id="cnpj-dono" placeholder="00.000.000/0000-00" required />
                        </div>
                        <div class="form-group">
                            <label for="senha-dono">Senha</label>
                            <input type="password" id="senha-dono" required />
                        </div>
                        <button type="submit" class="btn-primary">Cadastrar Estacionamento</button>
                    </form>
                    <div id="owner-msg" class="message"></div>
                    <div class="links">
                        <a href="#" id="linkBackToLoginFromOwner">Já tem uma conta? Faça login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
 
    <nav class="bottom-nav">
        <button class="nav-btn" id="navHome" aria-label="Home">
            <span class="material-symbols-outlined">home</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-btn disabled" id="navArea" aria-label="Minha área">
            <span class="material-symbols-outlined" id="navAreaIcone">grid_view</span>
            <span class="nav-label" id="navAreaRotulo"></span>
        </button>
        <button class="nav-btn active" id="navConta" aria-label="Conta">
            <span class="material-symbols-outlined">account_circle</span>
            <span class="nav-label">Conta</span>
        </button>
    </nav>
 
    <script type="module" src="src/dom/navegacao.ts"></script>
    <script type="module" src="src/pages/login.ts"></script>
    <script type="module" src="src/pages/cadastroCliente.ts"></script>
    <script type="module" src="src/pages/cadastroDono.ts"></script>
    <script type="module" src="src/pages/home.ts"></script>
</body>
</html>
