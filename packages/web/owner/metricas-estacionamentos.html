<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do pátio - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/owner.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=account_circle,arrow_back,close,directions_car,grid_view,logout,menu,person,refresh,search"/>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-esquerda">
            <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
                <span class="material-symbols-sharp" aria-hidden="true">menu</span>
            </button>
            <nav class="cabecalho-nav" id="cabecalhoNav" aria-label="Principal"></nav>
        </div>
        <a class="marca" href="/index.html">
            <svg class="marca-emblema" viewBox="0 0 44 44" aria-hidden="true"><path d="M0 44V18H6V12H12V6H18V0H26V6H32V12H38V18H44V44Z" fill="#1A1A17"/><path d="M22 39L39.9 32.5M22 39L35.4 25.6M22 39L28.5 21.1M22 39L22.0 20.0M22 39L15.5 21.1M22 39L8.6 25.6M22 39L4.1 32.5" stroke="#E7C977" stroke-width="1.5" stroke-linecap="square"/><path d="M8 39H36" stroke="#E7C977" stroke-width="1.5"/></svg>
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-sharp" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-sharp" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <a href="estacionamentos.html" class="voltar-lista">
            <span class="material-symbols-sharp">arrow_back</span>
            Meus estacionamentos
        </a>

        <section id="bloqueio" class="bloqueio disabled">
            <h2>Painel do pátio</h2>
            <p id="bloqueioTexto"></p>
            <a id="bloqueioLink" href="../index.html#entrar" class="botao-primario">Ir para o login</a>
        </section>

        <section id="area" class="disabled">
            <div class="titulo-linha painel-cabecalho">
                <div>
                    <h2 id="patioNome"></h2>
                    <p id="patioEndereco" class="item-endereco"></p>
                </div>
                <div class="item-acoes">
                    <span id="patioEtiqueta" class="etiqueta"></span>
                    <button type="button" id="atualizar" class="botao-icone" title="Atualizar" aria-label="Atualizar">
                        <span class="material-symbols-sharp">refresh</span>
                    </button>
                    <a id="abrirEditor" class="abrir" href="editor.html">Abrir editor</a>
                </div>
            </div>

            <p id="mensagem" class="message"></p>

            <div class="kpis">
                <div class="kpi">
                    <p class="kpi-rotulo">Vagas</p>
                    <p class="kpi-valor" id="kpiTotal"></p>
                </div>
                <div class="kpi">
                    <p class="kpi-rotulo"><span class="ponto ponto-livre"></span>Livres</p>
                    <p class="kpi-valor" id="kpiLivres"></p>
                </div>
                <div class="kpi">
                    <p class="kpi-rotulo"><span class="ponto ponto-ocupada"></span>Ocupadas</p>
                    <p class="kpi-valor" id="kpiOcupadas"></p>
                </div>
                <div class="kpi">
                    <p class="kpi-rotulo"><span class="ponto ponto-reservada"></span>Reservadas</p>
                    <p class="kpi-valor" id="kpiReservadas"></p>
                </div>
                <div class="kpi">
                    <p class="kpi-rotulo">Ocupação</p>
                    <p class="kpi-valor" id="kpiOcupacao"></p>
                </div>
            </div>

            <section class="painel">
                <h3 class="painel-titulo">Ocupação agora</h3>
                <div id="barraOcupacao" class="barra" role="img"></div>
                <p id="semVagas" class="vazio disabled">
                    Nenhuma vaga cadastrada ainda. Desenhe e numere as vagas no editor.
                </p>
            </section>

            <div class="paineis">
                <section class="painel">
                    <h3 class="painel-titulo">Por tipo de vaga</h3>
                    <ul id="porTipo" class="tipos"></ul>
                </section>

                <section class="painel">
                    <h3 class="painel-titulo">Desenho</h3>
                    <dl id="desenho" class="numeros"></dl>
                </section>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="rodape-conteudo">
            <span class="rodape-marca">AMPS</span>
            <p class="rodape-lema">Saiba sua vaga antes de entrar</p>
        </div>
    </footer>

    <script type="module" src="../src/pages/metricasEstacionamentos.ts"></script>
</body>
</html>
