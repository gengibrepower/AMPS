<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus estacionamentos - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/owner.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,300,0,0&icon_names=account_circle,add,close,delete,directions_car,edit,grid_view,logout,menu,person,search"/>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-esquerda">
            <button type="button" id="menu-button" class="cabecalho-menu" aria-label="Abrir menu">
                <span class="material-symbols-sharp" aria-hidden="true">menu</span>
            </button>
            <nav class="cabecalho-nav" id="cabecalhoNav" aria-label="Principal"></nav>
        </div>
        <a class="marca" href="/index.html">
            <span class="marca-p" aria-hidden="true">P</span>
            <span class="marca-nome">AMPS</span>
        </a>
        <div class="cabecalho-conta" id="cabecalhoConta"></div>
    </header>

    <nav class="sidebar-nav disabled" aria-label="Menu">
        <div class="sidebar">
            <button type="button" id="close-sidebar-button" aria-label="Fechar menu">
                <span class="material-symbols-sharp" aria-hidden="true">close</span>
            </button>
            <ul class="nav-list" id="navLista">
                <li class="nav-item nav-item-account">
                    <button type="button" id="sidebarAccountBtn" aria-label="Conta">
                        <span class="material-symbols-sharp" aria-hidden="true">account_circle</span>
                        <span id="sidebarAccountLabel">Entrar</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <section id="bloqueio" class="bloqueio disabled">
            <h2>Área do dono</h2>
            <p id="bloqueioTexto"></p>
            <a id="bloqueioLink" href="../index.html#entrar" class="botao-primario">Ir para o login</a>
        </section>

        <section id="area" class="disabled">
            <div class="titulo-linha">
                <h2 class="titulo-tripla">Meus estacionamentos</h2>
                <button type="button" id="abrirNovo" class="botao-primario">
                    <span class="material-symbols-sharp">add</span>
                    Novo
                </button>
            </div>

            <form id="formPatio" class="formulario disabled" novalidate>
                <p id="tituloForm" class="formulario-titulo"></p>
                <div class="campo campo-nome">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" maxlength="150" required autocomplete="off">
                </div>
                <div class="campo campo-cep">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" maxlength="10" autocomplete="off">
                </div>
                <div class="campo campo-logradouro">
                    <label for="logradouro">Logradouro</label>
                    <input type="text" id="logradouro" name="logradouro" maxlength="255" autocomplete="off">
                </div>
                <div class="campo campo-numero">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" maxlength="20" autocomplete="off">
                </div>
                <div class="campo campo-bairro">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" maxlength="100" autocomplete="off">
                </div>
                <div class="campo campo-complemento">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento" maxlength="255" autocomplete="off">
                </div>
                <div class="campo campo-cidade">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" maxlength="100" autocomplete="off">
                </div>
                <div class="campo campo-uf">
                    <label for="estado">UF</label>
                    <input type="text" id="estado" name="estado" maxlength="2" autocomplete="off">
                </div>
                <div class="formulario-acoes">
                    <button type="button" id="cancelarPatio" class="botao-texto">Cancelar</button>
                    <button type="submit" id="salvarPatio" class="botao-primario">Criar</button>
                </div>
            </form>

            <p id="mensagem" class="message"></p>

            <p id="vazio" class="vazio disabled">
                Nenhum estacionamento ainda. Crie o primeiro para começar a desenhar o pátio.
            </p>

            <ul id="lista" class="lista"></ul>
        </section>
    </main>

    <script type="module" src="../src/pages/estacionamentos.ts"></script>
</body>
</html>
