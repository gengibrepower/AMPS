<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de pátio - AMPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/editor.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back,arrow_selector_tool,delete,local_parking,login,polyline,push_pin,route,undo"/>
</head>
<body>
    <header>
        <a href="estacionamentos.html" class="voltar" aria-label="Voltar">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="titulo">
            <span id="nomeDoPatio" class="nome">Carregando…</span>
            <span id="etiqueta" class="etiqueta disabled"></span>
        </div>

        <div class="acoes">
            <span id="avisoDeGravacao" class="aviso"></span>
            <button type="button" id="salvar" class="botao-salvar" title="Salvar (Ctrl+S)" disabled>Salvar</button>
            <button type="button" id="publicar" class="botao-publicar">Publicar</button>
        </div>
    </header>

    <main>
        <nav id="ferramentas" class="ferramentas disabled" aria-label="Ferramentas">
            <button type="button" class="ferramenta" data-ferramenta="selecionar" aria-pressed="true" title="Selecionar (V)">
                <span class="material-symbols-outlined">arrow_selector_tool</span>
                <span class="atalho">V</span>
            </button>
            <button type="button" class="ferramenta" data-ferramenta="candidate" aria-pressed="false" title="Vaga (1)">
                <span class="material-symbols-outlined">local_parking</span>
                <span class="atalho">1</span>
            </button>
            <button type="button" class="ferramenta" data-ferramenta="source" aria-pressed="false" title="Entrada (2)">
                <span class="material-symbols-outlined">login</span>
                <span class="atalho">2</span>
            </button>
            <button type="button" class="ferramenta" data-ferramenta="transit" aria-pressed="false" title="Via (3)">
                <span class="material-symbols-outlined">route</span>
                <span class="atalho">3</span>
            </button>
            <button type="button" class="ferramenta" data-ferramenta="attractor" aria-pressed="false" title="POI (4)">
                <span class="material-symbols-outlined">push_pin</span>
                <span class="atalho">4</span>
            </button>

            <span class="separador"></span>

            <button type="button" class="ferramenta" data-ferramenta="aresta" aria-pressed="false" title="Ligar nós (A)">
                <span class="material-symbols-outlined">polyline</span>
                <span class="atalho">A</span>
            </button>

            <span class="separador"></span>

            <button type="button" id="apagar" class="ferramenta" data-acao="apagar" title="Apagar (Del)" disabled>
                <span class="material-symbols-outlined">delete</span>
                <span class="atalho">Del</span>
            </button>
            <button type="button" id="desfazer" class="ferramenta" data-acao="desfazer" title="Desfazer (Ctrl+Z)" disabled>
                <span class="material-symbols-outlined">undo</span>
                <span class="atalho">Z</span>
            </button>
        </nav>

        <section id="quadro" class="quadro">
            <div id="palco" class="palco"></div>
        </section>

        <aside id="inspetor" class="inspetor disabled" aria-label="Inspetor">
            <p id="inspetorVazio" class="inspetor-vazio">Nada selecionado</p>

            <div id="inspetorNo" class="inspetor-corpo disabled">
                <h2 class="inspetor-titulo">
                    <span id="inspetorId" class="inspetor-id">—</span>
                    <span id="inspetorPapel" class="etiqueta"></span>
                </h2>
                <p class="inspetor-posicao">
                    x <span id="inspetorX" class="numero">—</span>
                    y <span id="inspetorY" class="numero">—</span>
                </p>

                <label class="campo" for="campoRotulo">rótulo</label>
                <input id="campoRotulo" class="entrada" type="text" maxlength="150" autocomplete="off" placeholder="sem rótulo">

                <div id="inspetorVaga" class="disabled">
                    <label class="campo" for="campoNumero">número</label>
                    <input id="campoNumero" class="entrada" type="text" maxlength="20" autocomplete="off">

                    <label class="campo" for="campoTipo">tipo</label>
                    <select id="campoTipo" class="entrada">
                        <option value="comum">comum</option>
                        <option value="pcd">PCD</option>
                        <option value="idoso">idoso</option>
                        <option value="moto">moto</option>
                        <option value="eletrico">elétrico</option>
                    </select>

                    <label class="campo" for="campoRotacao">rotação</label>
                    <input id="campoRotacao" class="entrada" type="number" min="0" max="359" step="1">
                    <div id="grausRapidos" class="graus">
                        <button type="button" class="grau" data-graus="0">0°</button>
                        <button type="button" class="grau" data-graus="90">90°</button>
                        <button type="button" class="grau" data-graus="180">180°</button>
                        <button type="button" class="grau" data-graus="270">270°</button>
                    </div>
                </div>
            </div>

            <div id="inspetorAresta" class="inspetor-corpo disabled">
                <h2 class="inspetor-titulo">
                    <span id="arestaDe" class="inspetor-id">—</span>
                    <span class="seta">→</span>
                    <span id="arestaPara" class="inspetor-id">—</span>
                </h2>

                <label class="campo" for="campoPeso">peso</label>
                <input id="campoPeso" class="entrada" type="number" min="0" step="0.1">
                <button type="button" id="recalcular" class="botao-inspetor">Recalcular pela distância</button>
                <p id="dicaPeso" class="inspetor-dica"></p>
            </div>

            <p id="inspetorErro" class="inspetor-erro"></p>
        </aside>

        <div id="bloqueio" class="bloqueio disabled">
            <p id="bloqueioTexto"></p>
            <a id="bloqueioSaida" href="../index.html" class="botao-saida disabled">Entrar de novo</a>
        </div>
    </main>

    <footer class="barra-status">
        <span class="leitura">x <span id="cursorX" class="numero">—</span></span>
        <span class="leitura">y <span id="cursorY" class="numero">—</span></span>
        <span class="leitura">zoom <span id="nivelZoom" class="numero">100%</span></span>
        <span class="leitura">versão <span id="versao" class="numero curto">—</span></span>
        <span class="leitura">seleção <span id="selecao" class="numero largo">—</span></span>
        <span class="leitura">alterado <span id="alterado" class="numero curto">não</span></span>
        <span class="dica">A liga dois nós em sequência · arraste o nó para mover · Del apaga · Ctrl+Z desfaz</span>
    </footer>

    <script type="module" src="../src/editor/editor.ts"></script>
</body>
</html>
